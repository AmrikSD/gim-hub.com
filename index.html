<!doctype html>
<html lang="en">
  <head>
    <title>GIM hub</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Standalone dev shell: replaces the Laravel blade so `vp dev` can run
         without PHP. CSRF token is a dummy; GET endpoints never check it. -->
    <meta name="csrf-token" content="dev-standalone" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <script>
      const storedTheme = localStorage.getItem("settings-site-theme");
      const prefersDarkTheme = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle(
        "dark-mode",
        storedTheme === "dark" || (!storedTheme && prefersDarkTheme),
      );
    </script>
    <script type="module" src="/resources/views/index.js"></script>
  </head>
  <body id="root"></body>
</html>
